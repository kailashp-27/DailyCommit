name: Bug report
description: Something is not working
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Steps, expected behavior and what you saw instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser / Android launcher
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details or screenshot
      description: Do not attach habit backups or personal notes.
